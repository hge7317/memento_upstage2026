<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Memory Replay — 사건 직후 기억을 복기하는 서비스</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --paper: #f4ede0;
      --paper-edge: #e8dcc8;
      --ink: #1c1814;
      --ink-soft: #5c5247;
      --red-stamp: #b04a2f;
      --red-stamp-soft: #c76b4f;
      --line: #d4c5a9;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      background: var(--paper);
      color: var(--ink);
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      line-height: 1.6;
      min-height: 100vh;
    }

    /* ===== 책장 랜딩 ===== */
    .cover {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 56px 24px 64px;
      text-align: left;
      opacity: 0;
      transition: opacity 0.8s ease;
      position: relative;
    }
    .cover.in-view { opacity: 1; }

    .cover-inner {
      max-width: 560px;
      width: 100%;
      margin: 0 auto;
    }

    /* — 표지 스탬프 (책 등판에 찍힌 마크 느낌) — */
    .stamp {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 48px;
      user-select: none;
    }
    .stamp-mark {
      width: 40px;
      height: 40px;
      border: 1.5px solid var(--ink);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink);
      font-family: "Noto Serif KR", serif;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.04em;
      background: transparent;
      position: relative;
    }
    /* 도장 잉크 번짐 잔여감 — 매우 약하게 */
    .stamp-mark::after {
      content: "";
      position: absolute;
      inset: -3px;
      border: 1px solid var(--line);
      border-radius: 50%;
      opacity: 0.5;
      pointer-events: none;
    }
    .stamp-name {
      font-size: 14px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-soft);
      font-weight: 500;
    }

    /* — 서문 태그 (목차의 한 줄 느낌) — */
    .epigraph {
      font-size: 11.5px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--red-stamp);
      font-weight: 600;
      margin-bottom: 36px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--line);
    }

    /* — 제목 페이지 (왼쪽 페이지 본문처럼) — */
    .title {
      font-family: "Noto Serif KR", "Apple SD Gothic Neo", "Malgun Gothic", serif;
      font-size: clamp(34px, 5.4vw, 48px);
      font-weight: 700;
      line-height: 1.3;
      letter-spacing: -0.025em;
      color: var(--ink);
      margin-bottom: 22px;
      text-wrap: pretty;
    }
    .title .line { display: block; }

    /* — 서문 단락 — */
    .lead {
      font-family: "Noto Serif KR", serif;
      font-size: 16px;
      line-height: 1.85;
      color: var(--ink-soft);
      margin-bottom: 44px;
      max-width: 480px;
    }
    .lead p { margin-bottom: 12px; }
    .lead p:last-child { margin-bottom: 0; }

    /* — 책갈피 탭 (시나리오) — */
    .bookmarks {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 48px;
      padding: 4px 2px;
    }
    .bookmark {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 8px 14px 8px 12px;
      font-size: 14px;
      color: var(--ink);
      cursor: default;
      transition: border-color 0.15s ease, background 0.15s ease;
    }
    .bookmark .tab {
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--red-stamp);
      border: 1px solid var(--red-stamp);
      border-radius: 2px;
      padding: 1px 6px;
      background: transparent;
      font-family: "Inter", sans-serif;
    }
    .bookmark-beta .tab { color: var(--ink-soft); border-color: var(--ink-soft); }

    /* — 페이지 넘김 CTA — */
    .turn {
      margin-bottom: 40px;
    }
    .turn-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--ink);
      color: var(--paper);
      border: 1px solid var(--ink);
      border-radius: 4px;
      padding: 14px 26px;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.01em;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
      font-family: "Inter", sans-serif;
    }
    .turn-btn:hover {
      background: var(--red-stamp);
      border-color: var(--red-stamp);
    }
    .turn-btn:active { transform: translateY(1px); }
    .turn-btn:focus-visible { outline: 3px solid var(--red-stamp); outline-offset: 2px; }
    .turn-btn .arrow {
      transition: transform 0.2s ease;
      font-size: 13px;
      line-height: 1;
    }
    .turn-btn:hover .arrow { transform: translateX(3px); }

    /* — 각주 (책 끝 주석 느낌) — */
    .colophon {
      font-size: 12.5px;
      color: var(--ink-soft);
      font-style: italic;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      max-width: 380px;
    }

    /* — 종이 결 미세 질감 (CSS only, 과장 없음) — */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.11  0 0 0 0 0.10  0 0 0 0 0.08  0 0 0 0.04 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/></svg>");
      opacity: 0.35;
      pointer-events: none;
      z-index: 0;
    }
    .cover, .cover-inner { position: relative; z-index: 1; }

    /* — 페이지 여백 훅: 내부 페이지에서도 쓸 수 있게 — */
    .page {
      max-width: 560px;
      margin: 0 auto;
      padding: 40px 24px;
    }

    /* 반응형 */
    @media (max-width: 480px) {
      .cover { padding: 40px 18px 52px; }
      .stamp { margin-bottom: 34px; }
      .epigraph { margin-bottom: 28px; }
      .title { font-size: clamp(28px, 7.5vw, 36px); }
      .lead { font-size: 15px; }
      .turn-btn { padding: 12px 20px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .cover { opacity: 1; transition: none; }
      .turn-btn .arrow { transition: none; }
    }
  </style>
</head>
<body>
  <section class="cover" id="cover">
    <div class="cover-inner">
      <!-- 표지 스탬프 -->
      <div class="stamp">
        <div class="stamp-mark" aria-hidden="true">M</div>
        <span class="stamp-name">Memory Replay</span>
      </div>

      <!-- 서문 태그 -->
      <p class="epigraph">사건 직후, 기억을 복기하는 서비스</p>

      <!-- 제목 페이지 -->
      <h1 class="title">
        <span class="line">기억이 흐려지기 전에,</span>
        <span class="line">먼저 적어 두세요</span>
      </h1>

      <!-- 서문 -->
      <div class="lead">
        <p>AI가 내용을 대신 만들지 않습니다.</p>
        <p>당신이 확인한 기억을 바탕으로, 더 잘 떠올리도록 하나씩 질문합니다.</p>
      </div>

      <!-- 책갈피 탭 -->
      <div class="bookmarks">
        <span class="bookmark">
          면접 복기
          <span class="tab">정식</span>
        </span>
        <span class="bookmark bookmark-beta">
          분실물 찾기
          <span class="tab">베타</span>
        </span>
        <span class="bookmark bookmark-beta">
          미팅 복기
          <span class="tab">베타</span>
        </span>
      </div>

      <!-- 페이지 넘김 CTA -->
      <div class="turn">
        <button type="button" class="turn-btn" id="start-btn">
          복기 시작하기
          <span class="arrow">→</span>
        </button>
      </div>

      <!-- 각주 -->
      <p class="colophon">정리하지 않아도 됩니다. 단어만 적어도 시작할 수 있습니다.</p>
    </div>
  </section>

  <script>
    (function () {
      var el = document.getElementById('cover');
      if (!el) return;
      var ticking = false;
      function onScroll() {
        if (ticking) return;
        ticking = true;
        requestAnimationFrame(function () {
          var rect = el.getBoundingClientRect();
          if (rect.top < window.innerHeight * 0.85) {
            el.classList.add('in-view');
          }
          ticking = false;
        });
      }
      window.addEventListener('scroll', onScroll, { passive: true });
      window.addEventListener('resize', onScroll);
      onScroll();
    })();
  </script>
</body>
</html>
